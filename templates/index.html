<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 가족 홈</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/619/619153.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 20px 16px; max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; position: relative; }
        
        .brand-title { font-size: 20px; font-weight: 800; color: #0f172a; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; transition: background 0.2s; user-select: none; }
        .brand-title:hover { background: #e2e8f0; }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        
        .icon-btn { position: relative; background: none; border: none; font-size: 24px; cursor: pointer; padding: 4px; display: flex; align-items: center; }
        .mail-badge { position: absolute; top: 0; right: -4px; background: #ef4444; color: white; border-radius: 50%; font-size: 11px; font-weight: bold; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

        .user-dropdown-container { position: relative; }
        .user-btn { background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .user-btn:hover { background: #cbd5e1; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 38px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); width: 160px; z-index: 50; overflow: hidden; }
        .dropdown-menu.active { display: block; }
        .dropdown-item { padding: 12px 14px; font-size: 14px; color: #334155; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; border-bottom: 1px solid #f1f5f9; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: #f8fafc; color: #0f172a; }
        .dropdown-item.logout { color: #ef4444; }

        .card { background: white; border-radius: 14px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        input[type="text"]:focus, textarea:focus, select:focus { border-color: #2563eb; }
        textarea { resize: vertical; min-height: 60px; }
        button.action-btn { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        button.action-btn:hover { background: #1d4ed8; }
        
        .item-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .item { background: #f1f5f9; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
        .item-meta { font-size: 11px; color: #64748b; margin-top: 4px; display: block; }
        .empty-text { font-size: 13px; color: #94a3b8; text-align: center; padding: 8px 0; }

        /* 모달 공통 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
