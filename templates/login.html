<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 가족 홈</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 32px 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 18px; color: #222; }
        .flash { color: #e11d48; font-size: 14px; margin-bottom: 14px; font-weight: 500; }
        .input-box { position: relative; margin-bottom: 12px; }
        .input-box input { width: 100%; padding: 14px 44px 14px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; }
        .input-box input:focus { border-color: #2563eb; ring: 2px solid #93c5fd; }
        .toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; color: #6b7280; padding: 4px; }
        .btn-submit { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
        .btn-submit:hover { background: #0051bb; }
        .link-toggle { margin-top: 16px; font-size: 14px; color: #4b5563; text-decoration: underline; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 우리 가족 홈</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- 로그인 폼 -->
    <form id="loginForm" action="/login" method="POST">
        <div class="input-box">
            <input type="text" name="username" placeholder="이름 / 닉네임" required autocomplete="username">
        </div>
        <div class="input-box">
            <input type="password" id="loginPw" name="password" placeholder="비밀번호" required autocomplete="current-password">
            <button type="button" class="toggle-btn" onclick="togglePassword('loginPw', this)" title="비밀번호 표시/숨기기">👁️</button>
        </div>
        <button type="submit" class="btn-submit">로그인</button>
        <div>
            <span class="link-toggle" onclick="toggleView('register')">처음이신가요? 가족 등록하기</span>
        </div>
    </form>

    <!-- 회원가입 폼 -->
    <form id="registerForm" action="/register" method="POST" style="display: none;">
        <div class="input-box">
            <input type="text" name="username" placeholder="이름 / 닉네임" required autocomplete="username">
        </div>
        <div class="input-box">
            <input type="password" id="registerPw" name="password" placeholder="비밀번호" required autocomplete="new-password">
            <button type="button" class="toggle-btn" onclick="togglePassword('registerPw', this)" title="비밀번호 표시/숨기기">👁️</button>
        </div>
        <div class="input-box">
            <input type="password" id="inviteCode" name="invite_code" placeholder="가족 초대코드" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('inviteCode', this)" title="초대코드 표시/숨기기">👁️</button>
        </div>
        <button type="submit" class="btn-submit" style="background: #10b981;">가족으로 등록하기</button>
        <div>
            <span class="link-toggle" onclick="toggleView('login')">이미 계정이 있으신가요? 로그인</span>
        </div>
    </form>
</div>

<script>
    // 로그인 / 회원가입 화면 전환
    function toggleView(mode) {
        if (mode === 'register') {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        } else {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }
    }

    // 비밀번호 보이기 / 숨기기 토글 기능
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🔒';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }
</script>

</body>
</html>
