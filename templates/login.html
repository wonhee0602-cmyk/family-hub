<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가족 허브 - 로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #888; }
        .tab.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; margin-bottom: -2px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #4338ca; }
        .flash { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 우리 가족 공간</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="tabs">
        <div class="tab" id="loginTab" onclick="showForm('login')">로그인</div>
        <div class="tab active" id="registerTab" onclick="showForm('register')">회원가입</div>
    </div>

    <!-- 로그인 폼 -->
    <form id="loginForm" action="/login" method="POST" style="display: none;">
        <div class="input-group">
            <label>닉네임</label>
            <input type="text" name="username" required autocomplete="username">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">로그인하기</button>
    </form>

    <!-- 회원가입 폼 -->
    <form id="registerForm" action="/register" method="POST">
        <div class="input-group">
            <label>가족 초대코드</label>
            <input type="text" name="invite_code" placeholder="우리집1234" required>
        </div>
        <div class="input-group">
            <label>닉네임</label>
            <input type="text" name="username" placeholder="이원희" required autocomplete="username">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" name="password" required autocomplete="new-password">
        </div>
        <button type="submit">가족으로 등록하기</button>
    </form>
</div>

<script>
    function showForm(type) {
        if (type === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerTab').classList.add('active');
        }
    }
</script>

</body>
</html>
